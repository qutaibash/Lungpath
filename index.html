<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LungPath</title>
<meta name="description" content="Pulmonary nodule and lung cancer decision support for UK clinicians (BTS 2015, NICE NG122).">
<meta name="theme-color" content="#2e5aa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LungPath">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f9f9fd; --surface:#f9f9fd; --surface-2:#eceef5; --surface-3:#e1e4ee;
  --fg:#191c22; --fg-2:#44474f; --line:#c5c8d2;
  --primary:#2e5aa8; --on-primary:#fff; --primary-c:#d8e2ff; --on-primary-c:#001a43;
  --tert:#9a4a2e; --tert-c:#ffdbcf;
  --ok:#1f6b3a; --ok-c:#cdeed5; --warn:#7a5900; --warn-c:#ffe08a; --bad:#a12a2a; --bad-c:#ffdad6;
  --font:Roboto,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171d; --surface:#14171d; --surface-2:#1c2028; --surface-3:#262a33;
  --fg:#e2e2e9; --fg-2:#c4c6d0; --line:#3d414b;
  --primary:#aec6ff; --on-primary:#002e6b; --primary-c:#16428a; --on-primary-c:#d8e2ff;
  --tert:#ffb59c; --tert-c:#5e2410;
  --ok:#9cd8ab; --ok-c:#0f3b1f; --warn:#f2c94c; --warn-c:#433200; --bad:#ffb4ab; --bad-c:#5c1414;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);position:relative}
.status{display:none}
.appbar{padding-top:calc(env(safe-area-inset-top,0px) + 4px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.nav{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.field input,.field select{font-size:16px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;z-index:5}
.modal .box{background:var(--surface);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:400px}
.modal h3{margin:0;font-size:20px}
.modal p{margin:0;font-size:14px;color:var(--fg-2)}
/* ---------- app chrome ---------- */
.status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:12px;font-weight:500;color:var(--fg-2)}
.appbar{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px 8px;min-height:56px}
.appbar h2{font-size:20px;font-weight:500;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-3)}
.iconbtn svg{width:24px;height:24px}
.content{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.content>*{flex-shrink:0}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);padding:10px 4px 14px}
.nav button{border:0;background:none;color:var(--fg-2);font:500 12px var(--font);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0}
.nav .pill{width:60px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--fg)}
.nav button.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- components ---------- */
.card{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.tap{cursor:pointer;border:0;text-align:left;color:inherit;font:inherit;width:100%}
.card.tap:hover{background:var(--surface-3)}
.card h3{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--fg-2);font-size:13.5px}
.hero{background:var(--primary-c);color:var(--on-primary-c);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero h3{margin:0;font-size:20px;font-weight:600}
.hero p{margin:0;font-size:13.5px;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface-2);border:0;border-radius:16px;padding:12px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:4px}
.mini:hover{background:var(--surface-3)}
.mini b{font-size:14px;font-weight:600}
.mini span{font-size:12px;color:var(--fg-2)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-top:6px}
.btn{border:0;border-radius:20px;height:40px;padding:0 20px;font:500 14px var(--font);cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.text{background:none;color:var(--primary);padding:0 10px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:flex;flex-direction:column;gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:flex;gap:12px;align-items:flex-start}
.choice:hover{background:var(--surface-2)}
.choice.sel{border-color:var(--primary);background:var(--primary-c);color:var(--on-primary-c)}
.choice b{display:block;font-weight:600;font-size:14.5px}
.choice small{display:block;color:inherit;opacity:.75;font-size:12.5px;margin-top:2px}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--fg-2);flex:none;margin-top:1px;display:grid;place-items:center}
.choice.sel .chk{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--fg);font:500 13.5px var(--font);cursor:pointer}
.chip.sel{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--fg-2);font-weight:500}
.field input,.field select{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:16px var(--font);width:100%;min-width:0}
.field input{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.sw input{width:44px;height:24px;accent-color:var(--primary);flex:none}
.steps{display:flex;gap:4px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--surface-3)}
.steps i.on{background:var(--primary)}
.result{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--ok-c)} .result.warn{background:var(--warn-c)} .result.bad{background:var(--bad-c)} .result.info{background:var(--primary-c);color:var(--on-primary-c)}
.result .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.result.ok .tag{color:var(--ok)} .result.warn .tag{color:var(--warn)} .result.bad .tag{color:var(--bad)}
.result h3{margin:0;font-size:19px;line-height:1.25;font-weight:600;text-wrap:balance}
.result p,.result li{margin:0;font-size:13.5px}
.result ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.big{font:500 40px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.src{font-size:11.5px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.src::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--tert);flex:none}
.banner{background:var(--tert-c);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px}
.timeline{display:flex;flex-direction:column;gap:0;margin:2px 0}
.tl{display:grid;grid-template-columns:86px 14px 1fr;gap:8px;align-items:start;font-size:13px}
.tl .d{font-family:var(--mono);font-size:11.5px;white-space:nowrap;text-align:right;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:5px;background:currentColor;margin-top:4px;position:relative}
.tl .dot::after{content:"";position:absolute;left:4px;top:12px;width:2px;height:22px;background:currentColor;opacity:.3}
.tl:last-child .dot::after{display:none}
.tl .t{padding-bottom:14px}
.stage{display:flex;align-items:center;gap:14px}
.stage .big{font-size:46px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:34px 1fr;gap:10px}
.line .n{width:30px;height:30px;border-radius:15px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:600;font-size:12.5px}
.line h4{margin:0 0 4px;font-size:14px}
.line ul{margin:0;padding-left:16px;font-size:13px;color:var(--fg-2);display:flex;flex-direction:column;gap:3px}
.line ul b{color:var(--fg);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--fg-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.copy{align-self:flex-start}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;white-space:nowrap}


</style>
</head>
<body>
<div id="app"><div class="content" style="justify-content:center;align-items:center"><p>Loading LungPath…</p></div></div>
<script src="lungpath-core.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
